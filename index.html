<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP4 - Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Gestion des commandes</h1>

    <div id="error-box" class="alert alert-danger d-none"></div>

    <div id="stats" class="row g-3 mb-4"></div>

    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="search" class="form-control" placeholder="Rechercher par nom du client"></div>
      <div class="col-md-3"><select id="status-filter" class="form-select"></select></div>
      <div class="col-md-3"><select id="category-filter" class="form-select"></select></div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Commande</th><th>Client</th><th>Date</th><th>Statut</th><th>Total</th><th></th></tr></thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detail-modal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
